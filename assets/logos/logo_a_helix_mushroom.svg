<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">蘑菇 DNA 标志</title>
  <desc id="desc">蓝色圆角方形背景上的白色菌盖与 DNA 螺旋菌柄。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4398E8"/>
      <stop offset="0.55" stop-color="#2876C5"/>
      <stop offset="1" stop-color="#174C88"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.08" r="0.9">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.62" stop-color="#F5F9FE"/>
      <stop offset="1" stop-color="#DCEAF8"/>
    </linearGradient>
  </defs>

  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#glow)"/>
  <rect x="17" y="17" width="478" height="478" rx="111" fill="none" stroke="#FFFFFF" stroke-opacity="0.14" stroke-width="2"/>

  <!-- DNA helix stalk -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
    <g stroke-width="14">
      <path d="M224 263 C224 303 288 316 288 354 C288 391 240 407 240 447"/>
      <path d="M288 263 C288 303 224 316 224 354 C224 391 272 407 272 447"/>
    </g>
    <g stroke-width="8" stroke-opacity="0.96">
      <path d="M232 289 H280"/>
      <path d="M232 359 H280"/>
      <path d="M245 420 H267"/>
    </g>
  </g>

  <!-- Mushroom cap -->
  <path d="M104 239 C116 155 178 106 256 106 C334 106 396 155 408 239 C365 260 312 273 256 273 C200 273 147 260 104 239 Z" fill="url(#cap)"/>
  <path d="M108 238 C158 257 207 265 256 265 C305 265 354 257 404 238 C383 256 333 272 256 272 C179 272 129 256 108 238 Z" fill="#C9DDF2" fill-opacity="0.65"/>
  <path d="M151 186 C170 153 202 132 240 127" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" stroke-opacity="0.72"/>
  <path d="M180 246 C204 254 230 258 256 258 C282 258 308 254 332 246" fill="none" stroke="#F9FCFF" stroke-width="3" stroke-linecap="round" stroke-opacity="0.9"/>

</svg>
