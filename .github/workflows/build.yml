name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # 发布产物门禁：测试不过不构建（tag 可从任意 commit 打出，不能依赖 CI 恰好已过）
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # headless Linux 上 PyQt6 离屏渲染所需的系统库
      - run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - run: pytest -q

  build:
    needs: test
    strategy:
      matrix:
        include:
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
          - os: ubuntu-latest
            name: linux-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      # PyInstaller 分析/收集 PyQt6 时在 headless Linux 上需要的系统库
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - run: pyinstaller MycoFACT.spec --noconfirm

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/MycoFACT -DestinationPath dist/MycoFACT-${{ matrix.name }}.zip

      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: ditto -c -k --keepParent dist/MycoFACT.app dist/MycoFACT-${{ matrix.name }}.zip

      - name: Archive (Linux)
        if: runner.os == 'Linux'
        run: tar -czf dist/MycoFACT-${{ matrix.name }}.tar.gz -C dist MycoFACT

      - uses: actions/upload-artifact@v4
        with:
          name: MycoFACT-${{ matrix.name }}
          path: dist/MycoFACT-${{ matrix.name }}.*
          if-no-files-found: error

      # 仅 tag 触发时：把三平台产物附到对应的 GitHub Release
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MycoFACT-${{ matrix.name }}.*
          generate_release_notes: true
