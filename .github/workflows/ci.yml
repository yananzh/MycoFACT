name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # UI 冒烟测试（pytest-qt）在 import 链上需要 PyQt6/qtawesome，装完整运行时依赖
      - run: pip install -r requirements.txt
      # headless Linux 上 PyQt6 离屏渲染所需的系统库
      - if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 \
            libfontconfig1 libxcb-cursor0
      - run: pytest -q
